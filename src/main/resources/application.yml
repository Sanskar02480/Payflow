server:
  port: 8080

spring:
  application:
    name: payflow

  # ---- PostgreSQL ----
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payflow}
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD:change-me-locally}
    driver-class-name: org.postgresql.Driver

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      # 'update' auto-creates/alters tables to match @Entity classes.
      # Fine for dev — use 'validate' or Flyway/Liquibase in prod.
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
    open-in-view: false

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # ---- Kafka ----
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: payflow-notification
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.payflow.kafka.event"

# ---- App-specific config ----
payflow:
  jwt:
    # 64+ char secret for HS256/HS512. Override via env in prod!
    secret: ${JWT_SECRET:change-me-please-this-is-a-dev-only-secret-key-min-64-chars-long-xxxx}
    expiration-ms: 3600000              # 1 hour  (default session)
    remember-me-expiration-ms: 86400000 # 24 hours (when "Remember me" is checked)
  password-reset:
    token-ttl-minutes: 15
  daily-limit:
    # Total amount a single user can SEND across all transfers within a UTC day.
    # Refunds do not consume this budget; this is "outgoing spend" only.
    amount: 50000.00
  kafka:
    payment-completed-topic: payment_completed
  rate-limit:
    payment-per-minute: 10
  idempotency:
    ttl-hours: 24

logging:
  level:
    com.payflow: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
